<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>1688分类选品与供应链研究</title>
  <style>
    :root{--ink:#192231;--muted:#687386;--line:#e4e8ef;--paper:#fff;--bg:#f3f5f8;--orange:#f56600;--orange2:#fff0e5;--green:#13795b;--blue:#3159c8;--red:#b73a4b;--purple:#6941c6}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(135deg,#fff1e6,transparent 32rem),var(--bg);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1380px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.hero,.panel,.opportunity,.category,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px}.hero{display:grid;grid-template-columns:1.3fr .7fr;overflow:hidden}.hero-copy{padding:30px}.hero-side{padding:28px;background:linear-gradient(145deg,#bd4800,var(--orange));color:#fff}h1{font-size:36px;line-height:1.15;margin:6px 0 10px}h2{font-size:26px;margin:34px 0 14px}h3{font-size:21px;margin:0}h4{font-size:18px;margin:0}.muted{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:15px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:23px}.opportunity{padding:22px;margin-bottom:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tag,.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--orange2);color:#ad4800;font-weight:700;font-size:12px}.pill{background:#edf1ff;color:#3555a8}.callout{margin:14px 0;padding:13px 15px;border-left:4px solid var(--orange);background:#fff8f2;border-radius:0 12px 12px 0}.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 18px}.funnel-step{padding:11px;border-radius:11px;background:#f7f8fa;border-top:3px solid var(--blue)}.funnel-step span{display:block;color:var(--muted);font-size:11px}.funnel-step strong{font-size:20px}.matrix{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:16px 0}.matrix-item{padding:12px;border-radius:12px;background:#f7f8fa;border:1px solid var(--line)}.matrix-item b{display:block}.matrix-item.found{border-color:#a7d8c8;background:#effaf6}.matrix-item.gap{border-style:dashed}.categories{display:grid;gap:14px}.category{padding:16px}.category-head{display:grid;grid-template-columns:1fr auto;gap:12px}.query{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#545f70;background:#f7f8fa;border-radius:8px;padding:7px 9px;margin-top:8px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.card{overflow:hidden}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eef0f3}.card-body{padding:14px}.title{min-height:43px;font-weight:750}.price{font-size:21px;color:#d35400;font-weight:800}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}.fact{padding:7px;background:#f7f8fa;border-radius:8px}.fact span{display:block;font-size:11px;color:var(--muted)}.decision{font-weight:700}.decision-shortlist,.decision-priority{color:var(--green)}.decision-observe{color:#a55b18}.decision-exclude{color:var(--red)}.evidence{padding:9px;background:#f4f1ff;border-radius:9px;margin:8px 0}.evidence b{color:var(--purple)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{font-size:11px;padding:3px 6px;border-radius:6px;background:#edf2ff;color:#3454a3}.empty{padding:16px;border:1px dashed #c9ced7;border-radius:12px;color:var(--muted);margin-top:10px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.box{padding:13px;background:#f7f8fa;border-radius:12px}ul{margin:6px 0 0;padding-left:20px}.table-wrap{overflow-x:auto;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}a{color:var(--blue);text-decoration:none}footer{text-align:center;color:var(--muted);margin-top:30px;font-size:12px}@media(max-width:1050px){.matrix{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.hero{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.funnel{grid-template-columns:repeat(2,1fr)}.matrix,.products,.cols{grid-template-columns:1fr}.top,.category-head{grid-template-columns:1fr;display:grid}h1{font-size:29px}}
  </style>
  <style>
    .hero>*,.summary>*,.funnel>*,.matrix>*,.products>*,.cols>*,.opportunity,.category,.card{min-width:0}
    h1,.hero-side,.query,.title{overflow-wrap:anywhere;word-break:break-word}
    @media(max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}.matrix,.products,.cols{grid-template-columns:minmax(0,1fr)}.top,.category-head{grid-template-columns:minmax(0,1fr)}.table-wrap{border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}.table-wrap table{width:max-content;min-width:760px}.table-wrap th,.table-wrap td{min-width:88px;word-break:normal;overflow-wrap:break-word}.table-wrap th:first-child,.table-wrap td:first-child{min-width:150px}.table-wrap th:last-child,.table-wrap td:last-child{min-width:220px}}
  </style>
</head>
<body><main id="app"></main>
<script>window.REPORT_DATA=__REPORT_DATA__;</script>
<script>
const d=window.REPORT_DATA,app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=a=>(a&&a.length)?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<span class="muted">—</span>';
const val=v=>v===null||v===undefined||v===''?'—':esc(v),num=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN'):'—';
const labels={market_proven:'市场验证款',novel_structure:'新颖结构款',aesthetic:'高颜值款',scenario_specific:'场景专用款',premium_quality:'品质升级款',solution_bundle:'组合解决方案'};
const roles={traffic:'引流',benchmark:'市场标杆',content:'内容传播',brand:'品牌形象',conversion:'转化',profit:'利润',aov:'客单提升',none:'未分配'};
const image=p=>p.image_record?.url_allowed?`<img src="${esc(p.image_record.image_url)}" alt="${esc(p.title)}" loading="lazy" referrerpolicy="no-referrer">`:'<div class="empty">图片 URL 不可用，不能作为视觉型候选依据</div>';
const product=p=>{const a=p.assessment||{},v=a.visual_review||{},visual=(v.visible_cues||[]).length?`<div class="evidence"><b>图片复核</b>${list(v.visible_cues)}${v.aesthetic_style?`<div class="muted">风格：${esc(v.aesthetic_style)}</div>`:''}</div>`:'';return `<article class="card">${image(p)}<div class="card-body"><div class="top"><span class="decision decision-${esc(a.decision)}">${esc(a.decision)}</span><span class="pill">类内 #${val(a.category_rank)} · ${esc(roles[a.portfolio_role]||a.portfolio_role)}</span></div><div class="title">${esc(p.title)}</div><div class="price">￥${val(p.price)}</div><div class="facts"><div class="fact"><span>起批量</span>${val(p.quantity_begin)} ${esc(p.unit||'')}</div><div class="fact"><span>销量</span>${num(p.sold_count)}</div><div class="fact"><span>库存</span>${num(p.stock_amount)}</div><div class="fact"><span>供应商</span>${esc(p.supplier||'—')}</div></div>${visual}<div class="chips">${[...(p.service_infos||[]),...(p.selling_points||[])].slice(0,6).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>${list(a.reasons)}<a href="${esc(p.detail_url)}" target="_blank" rel="noopener noreferrer">打开1688商品详情 →</a></div></article>`};
const category=c=>`<section class="category"><div class="category-head"><div><h4>${esc(labels[c.category]||c.category)}</h4><div class="muted">${esc(c.purpose||'')}</div></div><span class="tag">${c.status==='found'?`${c.candidate_count} 个候选`:'暂时缺口'}</span></div><div class="query">检索词：${(c.queries||[]).map(esc).join(' ｜ ')||'—'}</div><p>${esc(c.summary||'')}</p>${c.shortfall_reason?`<div class="callout"><b>数量说明</b><br>${esc(c.shortfall_reason)}</div>`:''}${c.products?.length?`<div class="products">${c.products.map(product).join('')}</div>`:`<div class="empty">本轮没有足够证据的${esc(labels[c.category]||c.category)}。保留缺口，不用通货强行补位。${c.next_test?`<br>建议：${esc(c.next_test)}`:''}</div>`}</section>`;
const supplier=s=>`<tr><td><a href="${esc(s.company_url)}" target="_blank" rel="noopener noreferrer">${esc(s.company_name)}</a><br><span class="muted">${esc(s.location||'')}</span></td><td class="decision decision-${esc(s.assessment?.decision)}">${esc(s.assessment?.decision)}</td><td>${(s.assessment?.supported_categories||[]).map(x=>esc(labels[x]||x)).join('、')||'—'}</td><td>${esc((s.cooperation_modes||[]).join('、')||'—')}</td><td>${s.support_proofing===true?'支持':s.support_proofing===false?'未标注':'—'}</td><td>${esc((s.assessment?.reasons||[]).join('；'))}</td></tr>`;
const task=t=>`<tr><td>${esc(t.task_id)}</td><td>${esc(labels[t.strategy_category]||t.strategy_category||'供应商基线')}</td><td>${esc(t.query)}</td><td>${t.success?'成功':'失败'}</td><td>${esc(t.message||'')}</td></tr>`;
const funnel=o=>{const c=o.coverage||{},ps=o.product_views||[],count=x=>ps.filter(p=>p.assessment?.decision===x).length;return `<h4>召回与筛选漏斗</h4><div class="funnel"><div class="funnel-step"><span>CLI原始召回</span><strong>${num(c.raw_product_rows??c.product_count)}</strong></div><div class="funnel-step"><span>商品ID去重</span><strong>${num(c.product_count)}</strong></div><div class="funnel-step"><span>排除</span><strong>${count('exclude')}</strong></div><div class="funnel-step"><span>继续观察</span><strong>${count('observe')}</strong></div><div class="funnel-step"><span>优先验证</span><strong>${count('shortlist')}</strong></div></div>`};
const opportunities=(d.opportunities||[]).map(o=>{const a=o.analysis||{},c=o.coverage||{},views=o.category_views||[];return `<section class="opportunity"><div class="top"><div><h3>${esc(o.name)}</h3><div class="muted">${esc(o.job_to_be_done||'')}</div></div><span class="tag">${esc(a.status)} · ${esc(a.confidence)}</span></div><div class="callout"><b>本方向结论</b><br>${esc(a.conclusion||'')}</div>${funnel(o)}<h4>分类选品矩阵</h4><div class="matrix">${views.map(x=>`<div class="matrix-item ${esc(x.status)}"><b>${esc(labels[x.category])}</b><span>${x.status==='found'?`${x.candidate_count} 个进入类内比较`:'缺口待补'}</span></div>`).join('')}</div><div class="categories">${views.map(category).join('')}</div><div class="cols"><div class="box"><b>组合角色</b>${list(a.portfolio_summary)}</div><div class="box"><b>风险与下一步</b>${list([...(a.risks||[]),...(a.next_validation_steps||[])])}</div></div><h4 style="margin-top:20px">供应链信号</h4>${o.supplier_views?.length?`<div class="table-wrap"><table><thead><tr><th>供应商</th><th>判断</th><th>支持分类</th><th>合作方式</th><th>打样</th><th>依据</th></tr></thead><tbody>${o.supplier_views.map(supplier).join('')}</tbody></table></div>`:'<div class="empty">供应商检索无有效结果或该分支不可用。</div>'}<h4 style="margin-top:20px">原始检索证据</h4><div class="table-wrap"><table><thead><tr><th>任务</th><th>分类</th><th>精确查询</th><th>状态</th><th>摘要</th></tr></thead><tbody>${(o.tasks||[]).map(task).join('')}</tbody></table></div><div class="muted" style="margin-top:8px">覆盖：${c.success_count||0}/${c.task_count||0} 个任务成功，${c.raw_product_rows||0} 条原始商品记录，${c.product_count||0} 个去重商品，${c.supplier_count||0} 家去重供应商。</div></section>`}).join('');
const q=d.collection_quality||{},tot=(d.opportunities||[]).reduce((x,o)=>{x.r+=o.coverage?.raw_product_rows||0;x.p+=o.coverage?.product_count||0;x.h+=(o.product_views||[]).filter(p=>p.assessment?.decision==='shortlist').length;x.g+=(o.category_views||[]).filter(c=>c.status==='found').length;return x},{r:0,p:0,h:0,g:0});
app.innerHTML=`<header class="hero"><div class="hero-copy"><div class="muted">AI点睛需求 → 分类检索 → 类内比较 → 选品组合</div><h1>${esc(d.title)}</h1><p>${esc(d.source.plan_name||'')}｜计划ID ${esc(d.source.campaign_id||'')}</p></div><div class="hero-side"><b>研究结论，不构成采购授权</b><p>${esc(d.overall_recommendation||'')}</p></div></header><div class="summary"><div class="panel stat"><span>CLI原始召回</span><strong>${tot.r}</strong></div><div class="panel stat"><span>去重商品</span><strong>${tot.p}</strong></div><div class="panel stat"><span>优先验证</span><strong>${tot.h}</strong></div><div class="panel stat"><span>有候选的分类</span><strong>${tot.g}</strong></div></div><h2>六类选品机会</h2>${opportunities}<footer>销量高不等于新颖或高颜值；所有图片判断均基于本次检索样本。价格、库存、销量、服务与工厂标签为检索时点的平台信息，需通过详情、沟通、样品、合规与利润核算复验。</footer>`;
</script></body></html>
